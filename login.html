<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Create Account | ShieldNet</title>
        <link rel="icon" type="image/jpeg" href="/img/logo.jpg" />
        <link rel="stylesheet" href="/css/style.css" />
    </head>
    <body>
        <section class="auth-view auth-standalone" aria-labelledby="auth-title">
            <div class="auth-shell">
                <div class="auth-card">
                    <a href="index.html" class="auth-back">← Back to home</a>

                    <img src="/img/logo.jpg" alt="ShieldNet Security Emblem" class="auth-logo" />
                    <h1 id="auth-title">Create Your Account</h1>
                    <p class="auth-subtitle" id="auth-subtitle">
                        Join Egypt's verified security network. This is a demo: no real data is sent anywhere.
                    </p>

                    <div class="auth-tabs" role="tablist" aria-label="Account mode">
                        <button
                            type="button"
                            class="auth-tab is-active"
                            role="tab"
                            aria-selected="true"
                            data-mode="signup">
                            Create Account
                        </button>
                        <button type="button" class="auth-tab" role="tab" aria-selected="false" data-mode="signin">
                            Sign In
                        </button>
                    </div>

                    <form id="auth-form" class="auth-form" novalidate>
                        <div class="auth-field" data-only="signup">
                            <label for="auth-name">Full name</label>
                            <input
                                id="auth-name"
                                name="name"
                                type="text"
                                autocomplete="name"
                                placeholder="e.g. Tarek Mansour" />
                        </div>
                        <div class="auth-field">
                            <label for="auth-email">Email</label>
                            <input
                                id="auth-email"
                                name="email"
                                type="email"
                                autocomplete="email"
                                placeholder="you@example.com" />
                        </div>
                        <div class="auth-field">
                            <label for="auth-password">Password</label>
                            <input
                                id="auth-password"
                                name="password"
                                type="password"
                                autocomplete="new-password"
                                placeholder="At least 6 characters" />
                        </div>
                        <div class="auth-field" data-only="signup">
                            <label for="auth-role">I am a</label>
                            <select id="auth-role" name="role">
                                <option value="client">Client / Estate owner</option>
                                <option value="guard">Security guard</option>
                                <option value="agency">Guard agency</option>
                            </select>
                        </div>
                        <p class="auth-error" id="auth-error" role="alert" aria-live="polite"></p>
                        <button type="submit" class="auth-submit" id="auth-submit">Confirm &amp; Continue</button>
                    </form>
                </div>
            </div>
        </section>

        <script type="module" src="/js/script.js"></script>
    </body>
</html>
